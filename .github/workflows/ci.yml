name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile all application modules
        run: python -m compileall -q nexus
      - name: Run all tests including baseline completeness gate
        run: python -m pytest -q
