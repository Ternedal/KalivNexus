name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # One test environment for both suites: the v0.50.0 runtime (pytest,
      # FastAPI, httpx) and main's offline manifest catalog (jsonschema).
      - name: Install test dependencies
        run: python -m pip install -e '.[test,catalog]'
      - name: Compile all application modules
        run: python -m compileall -q nexus scripts tests
      - name: Run all tests including baseline completeness gate
        run: python -m pytest -q
