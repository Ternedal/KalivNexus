name: CI
# Push runs are main-only (as validate-manifests.yml): a push to a PR branch
# used to run both the push run and the pull_request run (20 % of the last 75
# runs were the same sha twice). workflow_dispatch covers any branch on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # One test environment for both suites: the v0.50.0 runtime (pytest,
      # FastAPI, httpx) and main's offline manifest catalog (jsonschema).
      - name: Install test dependencies
        run: python -m pip install -e '.[test,catalog]'
      - name: Compile all application modules
        run: python -m compileall -q nexus scripts tests
      - name: Run all tests including baseline completeness gate
        run: python -m pytest -q
