name: validate-manifests
on:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/validate-manifests.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'tests/**'
      - '.github/workflows/validate-manifests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate example manifest via CLI
        run: python scripts/validate_manifest.py examples/weather-readonly.manifest.json
      - name: Run manifest contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
