name: validate-manifests
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/validate-manifests.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/validate-manifests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema==4.23.0'
      - name: Validate example manifest via CLI
        run: python scripts/validate_manifest.py examples/weather-readonly.manifest.json
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run manifest contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Smoke test offline catalog export and comparison
        run: |
          mkdir -p /tmp/kalivnexus-catalog-smoke
          python -m scripts.list_manifest_catalog examples --output /tmp/kalivnexus-catalog-smoke/before.json
          python -m scripts.list_manifest_catalog examples --prefix does-not-exist. --output /tmp/kalivnexus-catalog-smoke/after.json
          python -m scripts.compare_manifest_catalogs /tmp/kalivnexus-catalog-smoke/before.json /tmp/kalivnexus-catalog-smoke/after.json > /tmp/kalivnexus-catalog-smoke/diff.json
          python -c 'import json; from pathlib import Path; d=json.loads(Path("/tmp/kalivnexus-catalog-smoke/diff.json").read_text()); assert d == {"added": [], "removed": ["weather.current.read"]}, d'
