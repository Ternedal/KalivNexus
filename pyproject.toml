[project]
name = "kaliv-nexus"
version = "0.50.0"
description = "Local-first API discovery and capability registry for Kaliv"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
# The offline manifest catalog (schemas/, scripts/ from main) validates with JSON Schema.
catalog = ["jsonschema==4.23.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
# main's top-level schemas/ directory would otherwise break flat-layout discovery
# ("Multiple top-level packages discovered"). Only nexus is the installable package.
[tool.setuptools.packages.find]
include = ["nexus*"]
